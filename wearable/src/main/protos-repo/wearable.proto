syntax = "proto3";

option java_package = "org.microg.wearable.proto";
option java_outer_classname = "WearableProto";
option java_multiple_files = true;

message AckAsset {
    string digest = 1;
}

message AppKey {
    string packageName = 1;
    string signatureDigest = 2;
}

message AppKeys {
    repeated AppKey appKeys = 1;
}

message Asset {
    // TODO
    string digest = 4;
}

message AssetEntry {
    string key = 1;
    Asset value = 2;
    int32 unknown3 = 3;
}

message ChannelControlRequest {
    int32 type = 1;
    int64 channelId = 2;
    bool fromChannelOperator = 3;
    string packageName = 4;
    string signatureDigest = 5;
    string path = 6;
    int32 closeErrorCode = 7;
}

message ChannelDataAckRequest {
    ChannelDataHeader header = 1;
    bool finalMessage = 2;
}

message ChannelDataHeader {
    int64 channelId = 1;
    bool fromChannelOperator = 2;
    int64 requestId = 3;
}

message ChannelDataRequest {
    ChannelDataHeader header = 1;
    bytes payload = 2;
    bool finalMessage = 3;
}

message ChannelRequest {
    ChannelControlRequest channelControlRequest = 2;
    ChannelDataRequest channelDataRequest = 3;
    ChannelDataAckRequest channelDataAckRequest = 4;
    int32 version = 6;
    int32 origin = 7;
}

message Connect {
    string id = 1;
    string name = 2;
    int64 peerAndroidId = 3;
    int32 unknown4 = 4;
    int32 peerVersion = 5;
    int32 peerMinimumVersion = 6;
    string networkId = 7;
}

message FetchAsset {
    string packageName = 1;
    string assetName = 2;
    bool permission = 3;
    string signatureDigest = 4;
}

message FilePiece {
    string fileName = 1;
    bool finalPiece = 2;
    bytes piece = 3;
    string digest = 4;
}

message Heartbeat {

}

message MessagePiece {
    bytes data = 1;
    string digest = 2;
    int32 thisPiece = 3;
    int32 totalPieces = 4;
    int32 queueId = 5;
}

message Request {
    int32 requestId = 1;
    string packageName = 2;
    string signatureDigest = 3;
    string targetNodeId = 4;
    int32 unknown5 = 5;
    string path = 6;
    bytes rawData = 7;
    string sourceNodeId = 8;
    ChannelRequest request = 9;
    int32 generation = 10;
}

message RootMessage {
    SetAsset setAsset = 4;
    AckAsset ackAsset = 5;
    FetchAsset fetchAsset = 6;
    Connect connect = 7;
    SyncStart syncStart = 8;
    SetDataItem setDataItem = 9;
    Request rpcRequest = 10;
    Heartbeat heartbeat = 11;
    FilePiece filePiece = 12;
    bool hasAsset = 13;
    Request channelRequest = 16;
}

message SetAsset {
    string digest = 1;
    bytes data = 2;
    AppKeys appkeys = 3;
}

message SetDataItem {
    string packageName = 1;
    string uri = 2;
    repeated string unknown3 = 3;
    bytes data = 4;
    int64 seqId = 5;
    bool deleted = 6;
    string source = 7;
    repeated AssetEntry assets = 8;
    string signatureDigest = 9;
    int64 lastModified = 10;
}

message SyncStart {
    int64 receivedSeqId = 1;
    repeated SyncTableEntry syncTable = 2;
    int32 version = 3;
}

message SyncTableEntry {
    string key = 1;
    int64 value = 2;
}
